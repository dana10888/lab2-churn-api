
# Lab 3: Train candidates and run the promotion gate.
name: train-and-gate

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "data/**", "scripts/**", "requirements*.txt", "artifacts/**", ".github/workflows/train.yml"]
  push:
    branches: [main]
    paths: ["src/**", "data/**", "scripts/**", "requirements*.txt", "artifacts/**", ".github/workflows/train.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: train and gate
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
      GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Start MLflow
        run: docker compose -f docker-compose.mlflow.yml up -d --wait

      - name: Find the champion to beat
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"

          if [ -n "$BASE" ] && git show "${BASE}:artifacts/champion.json" > "$RUNNER_TEMP/champion.json" 2>/dev/null; then
            echo "Champion found on base branch"
          elif [ -f artifacts/champion.json ]; then
            cp artifacts/champion.json "$RUNNER_TEMP/champion.json"
            echo "Using the committed Lab 3 champion"
          else
            echo "ERROR: No champion found"
            exit 1
          fi

          cat "$RUNNER_TEMP/champion.json"

      - name: Train the candidates
        run: |
          echo "BATCH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          BATCH="${GITHUB_SHA::7}" python -m src.train.train_mlflow

      - name: Promotion gate
        run: python scripts/promote.py --champion-file "$RUNNER_TEMP/champion.json"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Gate"
            echo "Batch \`${GITHUB_SHA::7}\`. See the step above for PROMOTED or BLOCKED."
            echo "To record a promotion, commit \`artifacts/champion.json\`, \`artifacts/metadata.json\` and \`artifacts/model.joblib\` from your own run of \`scripts/promote.py\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # TODO: After the gate passes on main, build the Docker image,
      # run the smoke test, and deploy the champion.
